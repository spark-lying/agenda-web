<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda Kelas</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
<div class="wrap">
  <header>
    <h1>Agenda</h1>
    <div class="today" id="todayLabel"></div>
  </header>

  <div class="screenswitch">
    <button class="tab2 active" id="calendarbtn">Calendar</button>
    <button class="tab2" id="listbtn">Lists of Assignments</button>
  </div>

  <div id="calendarscreen" class="screen">
    <div class="calendar-header">
      <button class="somebuttons" id="prev-btn"><i class="fa-solid fa-arrow-left"></i></button>
      <h3 id="month-year"></h3>
      <button class="somebuttons" id="next-btn"><i class="fa-solid fa-arrow-right"></i></button>
    </div>

    <div class="weekdays">
      <div>Sunday</div>
      <div>Monday</div>
      <div>Tuesday</div>
      <div>Wednesday</div>
      <div>Thursday</div>
      <div>Friday</div>
      <div>Saturday</div>
    </div>

    <div id="days-grid" class="days-grid"></div>
  </div>

    <div id="popup" class="popup hidden">
        <div class="popup-content">
        <div class="popup-header">
          <h2 id="popuptitle"></h2>
          <button id="close-btn" class="somebuttons"><i class="fa-regular fa-circle-xmark"></i></button>
        </div>
        <h3 id="contents" class="popup-body"></h3>
      </div>
    </div>

  <br>

  <div id="listscreen" class="screen hidden">
  <div class="tabs">
      <button class="tab active" data-filter="all">All</button>
      <button class="tab" data-filter="assignment">Assignments</button>
      <button class="tab" data-filter="exam">Exams</button>
      <button class="tab" data-filter="notice">Notices</button>
  </div>
  <div class="board" id="board">
    <h2>Notice board</h2>
    <div id="noteList"></div>
  </div>

  <ul class="list" id="list"></ul>
  <div class="empty" id="empty" style="display:none;">Nothing here yet. Tap + to add something.</div>
</div>

<button class="fab" id="addBtn">+</button>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h2 id="sheetTitle">Add item</h2>
    <div class="typeRow">
      <button class="typeBtn on" data-type="assignment">Assignment</button>
      <button class="typeBtn" data-type="exam">Exam</button>
      <button class="typeBtn" data-type="notice">Notice</button>
    </div>
    <label for="fTitle">Title</label>
    <input type="text" id="fTitle" placeholder="e.g. Physics problem set 4">
    <label for="fDate" id="dateLabel">Due date</label>
    <input type="date" id="fDate">
    <label for="fNotes">Notes (optional)</label>
    <textarea id="fNotes" placeholder="Details, room number, chapters..."></textarea>
    <div class="actions">
      <button class="btn ghost" id="cancelBtn">Cancel</button>
      <button class="btn primary" id="saveBtn">Save</button>
    </div>
  </div>
</div>
</div>

<script src="script.js"></script>
</body>
</html>
